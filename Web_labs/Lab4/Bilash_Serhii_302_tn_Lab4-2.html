        <h1 align="center">

                     direction="up"
                     width="150"

            <marquee style="background-color: yellow;"
                     direction="down"
                     width="150"
                     height="600"
                     behavior="slide"

            </marquee>

            <marquee style="background-color: rosybrown;"
                     direction="down"
                     width="350"
                     height="600"
                     behavior="scroll"
                     scrollamount="10">
                Текст у рядку переміщується згори до низу.
            </marquee>

                     direction="down"
