<html>
    <head>
        <title>Білаш Сергій 302 - ТН Лабораторна робота №6_1</title>
        <meta name="keywords" />
        <meta name="description" />
    </head>

    <body>
        <h1>
            <script>
                const languages = {
                    ua: {
                        prompt: "Виберіть мову: ua або en?",
                        dayPrompt: "Введіть номер дня неділі від 1 до 7?",
                        daysOfWeek: [
                            "Неділя", "Понеділок", "Вівторок", "Середа", "Четвер", "П'ятниця", "Субота"
                        ]
                    },
                    en: {
                        prompt: "Choose language: ua or en?",
                        dayPrompt: "Enter the day number of the week (from 1 to 7)?",
                        daysOfWeek: [
                            "Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"
                        ]
                    }
                };

                function askLanguage() {
                    let language;
                    while (true) {
                        language = prompt(languages.ua.prompt).trim().toLowerCase();
                        if (languages[language]) {
                            break;
                        } else {
                            alert("Неправильний ввід! Спробуйте ще раз.");
                        }
                    }
                    askDay(language);
                }

                function askDay(language) {
                    let dayNumber;
                    while (true) {
                        dayNumber = prompt(languages[language].dayPrompt).trim();
                        if (dayNumber >= 1 && dayNumber <= 7) {
                            dayNumber = parseInt(dayNumber) - 1;
                            alert(languages[language].daysOfWeek[dayNumber]);
                            break;
                        } else {
                            alert("Неправильний ввід! Спробуйте ще раз.");
                        }
                    }
                }

                window.onload = function() {
                    askLanguage();
                }
            </script>
        </h1>
    </body>

</html>
