<html>
    <head>
        <title>Білаш Сергій 302 - ТН Лабораторна робота №4_1</title>
        <meta name="keywords" />
        <meta name="description" />
    </head>

    <body>
        <h1>
            <script>
                document.write("Завдання №1<br>");
                let t = prompt("Завдання №1. Введіть параметр total для функції seconds", '');

                t = Math.abs(Number(t));

                function seconds(total) {
                    return total % 60;
                }

                document.write("Результат функції seconds: " + seconds(t) + "<br>");
            </script>
        </h1>
    </body>

</html>
